
spring:
  application:
    name: spring-lab-01

  datasource:
    url: jdbc:postgresql://localhost:5432/springlab
    username: aruzan
    password: ""

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  owner: Aruzhan Orynbay
  group: IT1-2408IS
  date-pattern: "yyyy-MM-dd HH:mm:ss"

  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true

  locale:
    default-locale: en
    supported:
      - en
      - ru
      - kk

logging:
  level:
    web: INFO
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
