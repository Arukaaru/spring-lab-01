
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div sec:authorize="isAuthenticated()"
     style="text-align: right; padding: 15px 30px;">

    Signed in as:
    <strong sec:authentication="name">Username</strong>

    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/admin}"
       style="margin-left: 20px;">
        Administration
    </a>

    <form th:action="@{/logout}"
          method="post"
          style="display: inline; margin-left: 20px;">

        <button type="submit">Logout</button>

    </form>
</div>

<h1 th:text="${title}">Catalogue</h1>

<p th:if="${message}"
   class="flash"
   th:text="${message}"></p>

<div sec:authorize="hasRole('ADMIN')">

    <h2 style="text-align: center;">
        Add New Book
    </h2>

    <form th:action="@{/books}"
          method="post"
          style="text-align: center; margin-bottom: 30px;">

        <label for="title">Title:</label>
        <input type="text"
               id="title"
               name="title"
               required>

        <label for="author">Author:</label>
        <input type="text"
               id="author"
               name="author"
               required>

        <label for="year">Year:</label>
        <input type="number"
               id="year"
               name="year"
               required>

        <button type="submit">Add Book</button>

    </form>

</div>

<table>

    <tr>
        <th>#</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
        <th>Owner</th>
        <th>Actions</th>
    </tr>

    <tr th:each="book : ${books}">

        <td th:text="${book.id}">1</td>

        <td th:text="${book.title}">
            Title
        </td>

        <td th:text="${book.author}">
            Author
        </td>

        <td th:text="${book.year}">
            2020
        </td>

        <td th:text="${book.owner}">
            user
        </td>

        <td>
            <a th:if="${editableBookIds.contains(book.id)}"
               th:href="@{/books/{id}/edit(id=${book.id})}">
                Edit
            </a>

            <span th:unless="${editableBookIds.contains(book.id)}">
                Read only
            </span>
        </td>

    </tr>

</table>

</body>
</html>
