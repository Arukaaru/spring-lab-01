
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>Edit Book</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div style="text-align: right; padding: 15px 30px;">

  Signed in as:
  <strong sec:authentication="name">
    Username
  </strong>

</div>

<h1>Edit Book</h1>

<p style="text-align: center;">

  Owner:
  <strong th:text="${book.owner}">
    user
  </strong>

</p>

<form th:action="@{/books/{id}/edit(id=${book.id})}"
      method="post"
      style="text-align: center; margin-bottom: 30px;">

  <label for="title">Title:</label>

  <input type="text"
         id="title"
         name="title"
         th:value="${book.title}"
         required>

  <label for="author">Author:</label>

  <input type="text"
         id="author"
         name="author"
         th:value="${book.author}"
         required>

  <label for="year">Year:</label>

  <input type="number"
         id="year"
         name="year"
         th:value="${book.year}"
         required>

  <button type="submit">
    Save Changes
  </button>

</form>

<p style="text-align: center;">

  <a th:href="@{/books}">
    Back to Catalogue
  </a>

</p>

</body>
</html>
